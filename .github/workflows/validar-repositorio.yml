name: Validar repositorio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Validar repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
      - name: Instalar dependencias del sistema de validación
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            jq \
            p7zip-full \
            tar \
            unzip \
            util-linux \
            xz-utils \
            zip \
            zsh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24.x'
      - name: Instalar dependencias de validación
        run: python -m pip install --requirement requirements-docs.txt pre-commit
      - name: Ejecutar validación integrada
        run: bash scripts/check.sh
