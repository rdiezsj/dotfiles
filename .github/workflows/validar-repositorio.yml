name: Validar repositorio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Validar repositorio
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
      - name: Instalar dependencias del sistema de validación
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            jq \
            p7zip-full \
            tar \
            unzip \
            util-linux \
            xz-utils \
            zip \
            zsh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache: false
      - name: Instalar dependencias de validación
        run: python -m pip install --requirement requirements-docs.txt pre-commit
      - name: Ejecutar validación integrada
        run: bash scripts/check.sh
